<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Synthetic SDK contract host — not Verentis</title>
<body>
<h1>Synthetic SDK contract host — not a real workspace</h1>
<script>
window.addEventListener('message', (event) => {
    const wrapper = document.querySelector('iframe');
    if (event.origin !== 'https://office.localhost:8443' || event.source !== wrapper.contentWindow) return;
    if (event.data.type === 'verentis:dirty') window.dirtyReceived = event.data.isDirty;
    if (event.data.type === 'verentis:ready') {
        window.readyReceived = true;
        const delay = new URL(location.href).searchParams.get('handshake') === 'delayed' ? 15000 : 0;
        setTimeout(() => event.source.postMessage({
            type: 'verentis:init', version: 1,
            context: {
                surface: 'file',
                workspace: { id: 'synthetic-workspace', name: 'Synthetic' },
                file: { path: '/synthetic.docx', name: 'synthetic.docx', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', size: 1 }
            },
            token: { accessToken: 'MUST_NOT_LEAVE_HOST', expiresAt: new Date(Date.now() + 300000).toISOString(), scopes: [] }
        }, event.origin), delay);
    }
});
</script>
<iframe title="Office wrapper" src="https://office.localhost:8443" style="width:100%;height:85vh" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
</body>
</html>
